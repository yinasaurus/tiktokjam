[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "conversational-shopping-agent"
version = "0.1.0"
description = "Offline multi-turn shopping agent for TikTok TechJam 2026 Track 4"
requires-python = ">=3.11"
readme = "README.md"

[tool.setuptools.packages.find]
include = ["agent*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: harness-scale tests that need the official catalog",
]
